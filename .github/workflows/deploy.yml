name: Deploy

# El sitio se publica en cada push a main. La compilación vive aquí, no en un
# workflow aparte: es la misma que produce el artefacto que se despliega.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 'pages' y 'id-token' son los permisos que exige actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Dos despliegues no deben pisarse, pero tampoco cancelarse a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Persiltech.Site/Persiltech.Site.csproj --configuration Release --output ./publish

      # Cada ruta se publica como archivo real y con sus propios metadatos.
      # El porqué está documentado en la cabecera del script.
      - name: Generar las páginas por ruta
        run: bash .github/scripts/build-pages.sh ./publish/wwwroot

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish/wwwroot

  deploy:
    name: Deploy
    # Un pull request compila para validar, pero no publica.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
