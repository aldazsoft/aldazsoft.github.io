name: Deploy

# El sitio se publica en cada push a main. La compilación vive aquí, no en un
# workflow aparte: es la misma que produce el artefacto que se despliega.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 'pages' y 'id-token' son los permisos que exige actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Dos despliegues no deben pisarse, pero tampoco cancelarse a medias.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Publish
        run: dotnet publish src/Persiltech.Site/Persiltech.Site.csproj --configuration Release --output ./publish

      # GitHub Pages sirve archivos, no rutas. Y una ruta con punto —como
      # /UserServices.Abstractions— ningún servidor estático la trata como ruta de
      # SPA: la resuelve como nombre de archivo. Por eso cada página de paquete se
      # publica además como un index.html real dentro de su carpeta, y así responde
      # 200 en lugar de un 404 con el contenido correcto. Importa porque esa es la
      # URL que cada paquete declara en <PackageProjectUrl>.
      - name: Publicar las rutas de paquete como archivos
        run: |
          for route in UserServices.Abstractions; do
            mkdir -p "./publish/wwwroot/${route}"
            cp ./publish/wwwroot/index.html "./publish/wwwroot/${route}/index.html"
          done

      # Red de seguridad para cualquier otra ruta: Pages sirve 404.html, y al ser
      # copia de index.html el enrutador de Blazor la resuelve en el cliente.
      - name: SPA fallback
        run: cp ./publish/wwwroot/index.html ./publish/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./publish/wwwroot

  deploy:
    name: Deploy
    # Un pull request compila para validar, pero no publica.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
